@if(isLoading()) {
    <mat-spinner />
}

@let rebels = items();

@if(rebels) {
    @for (item of rebels; track item.id) {
        <a routerLink="./edit/{{item.id}}">{{ item.name }}</a>
    }
}

@defer(on hover) {
    <app-footer-rebel />
}
@placeholder(minimum 200ms) {
    <div>Fake footer</div>
}
@loading(minimum 200ms) {
    <p>Footer is loading</p>
}
